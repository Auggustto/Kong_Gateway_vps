# .github/workflows/deploy.yml
name: Build & Deploy

on:
  push:
    branches: [develop, main, release]

env:
  REGISTRY: docker.io
  IMAGE_NAME: fastapi

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Validar secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ Erro: DOCKER_USERNAME não está configurado"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "❌ Erro: DOCKER_TOKEN não está configurado"
            exit 1
          fi
          if [ -z "${{ secrets.TOKEN_PUSH }}" ]; then
            echo "⚠️  Aviso: GITHUB_TOKEN_PUSH não está configurado, usando GITHUB_TOKEN padrão"
            echo "   Para melhor suporte, crie um Personal Access Token (PAT)"
            echo "   🔗 https://github.com/settings/tokens/new"
          fi
          echo "✅ Secrets validados"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_PUSH || secrets.GITHUB_TOKEN }}

      - name: Definir variáveis de environment
        run: |
          TAG="${{ github.sha }}"
          SHORT_TAG="${TAG:0:7}"
          BRANCH="${{ github.ref_name }}"
          
          # Definir namespace baseado na branch
          case "$BRANCH" in
            develop)
              NAMESPACE="develop"
              ENV_NAME="develop"
              ;;
            main)
              NAMESPACE="main"
              ENV_NAME="prod"
              ;;
            release)
              NAMESPACE="release"
              ENV_NAME="staging"
              ;;
            *)
              echo "❌ Branch não reconhecida: $BRANCH"
              exit 1
              ;;
          esac
          
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "SHORT_TAG=$SHORT_TAG" >> $GITHUB_ENV
          echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV
          echo "ENV_NAME=$ENV_NAME" >> $GITHUB_ENV
          echo "IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
          
          echo "🔍 Variáveis de deploy:"
          echo "   Branch: $BRANCH"
          echo "   Namespace: $NAMESPACE"
          echo "   Ambiente: $ENV_NAME"
          echo "   Tag: $SHORT_TAG"
          echo "   Imagem: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:$SHORT_TAG"

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build imagem Docker
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ env.SHORT_TAG }} \
            --tag ${{ env.IMAGE }}:${{ env.NAMESPACE }}-latest \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${{ env.SHORT_TAG }} \
            .
          echo "✅ Imagem construída com sucesso"

      - name: Push para Docker Hub
        run: |
          docker push ${{ env.IMAGE }}:${{ env.SHORT_TAG }}
          docker push ${{ env.IMAGE }}:${{ env.NAMESPACE }}-latest
          echo "✅ Imagem enviada para Docker Hub"
          echo "   ${{ env.IMAGE }}:${{ env.SHORT_TAG }}"
          echo "   ${{ env.IMAGE }}:${{ env.NAMESPACE }}-latest"

      - name: Atualizar deployment manifests
        run: |
          DEPLOYMENT_FILE="kubernetes/${{ env.NAMESPACE }}/deployment.yml"
          
          if [ ! -f "$DEPLOYMENT_FILE" ]; then
            echo "❌ Arquivo não encontrado: $DEPLOYMENT_FILE"
            exit 1
          fi
          
          # Backup do arquivo original
          cp "$DEPLOYMENT_FILE" "$DEPLOYMENT_FILE.bak"
          
          # Atualizar imagem no deployment
          sed -i "s|image: .*fastapi:.*|image: ${{ env.IMAGE }}:${{ env.SHORT_TAG }}|g" "$DEPLOYMENT_FILE"
          
          # Validar alterações
          if grep -q "${{ env.IMAGE }}:${{ env.SHORT_TAG }}" "$DEPLOYMENT_FILE"; then
            echo "✅ Deployment atualizado com sucesso"
            echo "   Novo: ${{ env.IMAGE }}:${{ env.SHORT_TAG }}"
            git diff "$DEPLOYMENT_FILE"
          else
            echo "❌ Falha ao atualizar deployment"
            mv "$DEPLOYMENT_FILE.bak" "$DEPLOYMENT_FILE"
            exit 1
          fi

      - name: Validar manifests YAML
        run: |
          echo "🔍 Validando manifests YAML..."
          for file in kubernetes/${{ env.NAMESPACE }}/*.yml; do
            if [ -f "$file" ]; then
              echo "   Verificando: $file"
              if ! grep -q "apiVersion:" "$file"; then
                echo "❌ Arquivo inválido: $file (sem apiVersion)"
                exit 1
              fi
            fi
          done
          echo "✅ Todos os manifests são válidos"

      - name: Commit e push das alterações
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Verificar se há mudanças
          if git diff --quiet kubernetes/; then
            echo "ℹ️  Nenhuma mudança no manifesto"
            exit 0
          fi
          
          git add kubernetes/
          
          COMMIT_MSG="ci: deploy ${{ env.NAMESPACE }} - ${{ env.SHORT_TAG }}"
          git commit -m "$COMMIT_MSG" \
            --no-verify \
            -m "Branch: ${{ github.ref_name }}" \
            -m "Commit: ${{ github.sha }}" \
            -m "Author: ${{ github.actor }}"
          
          # Push com token para evitar erro de permissão
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN_PUSH || secrets.GITHUB_TOKEN }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          echo "✅ Manifest pusheado com sucesso"

      - name: Notificar resultado
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Pipeline concluído com sucesso!"
            echo "   Imagem: ${{ env.IMAGE }}:${{ env.SHORT_TAG }}"
            echo "   Namespace: ${{ env.NAMESPACE }}"
          else
            echo "❌ Pipeline falhou"
            exit 1
          fi