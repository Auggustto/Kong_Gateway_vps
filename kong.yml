# kong.yml - Configuração do Kong Gateway
# Formato: YAML declarativo para Kong 3.4+

_format_version: "3.0"
_transform: true

# ==================== SERVIÇOS ====================
services:
  - name: api-backend
    url: http://api-backend-svc.default.svc.cluster.local:8000
    protocol: http
    host: api-backend-svc.default.svc.cluster.local
    port: 8000
    retries: 5
    connect_timeout: 5000
    send_timeout: 60000
    read_timeout: 60000

    # Rotas
    routes:
      - name: api-root
        paths: 
          - /
        strip_path: false
        https_redirect_status_code: 426

      - name: api-health
        paths:
          - /health
        strip_path: false
        methods:
          - GET

# ==================== PLUGINS GLOBAIS ====================
plugins:
  # CORS
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  # Correlation ID para rastreamento
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  # Rate Limiting
  - name: rate-limiting
    config:
      minute: 100
      hour: 10000
      policy: local

  # Request/Response Transformer (opcional)
  # - name: request-transformer
  #   config:
  #     add:
  #       headers:
  #         - X-Service-Version:1.0

# ==================== UPSTREAMS (Load Balancing) ====================
upstreams:
  - name: api-backend-upstream
    algorithm: round_robin
    targets:
      - target: api-backend:8000
        weight: 100
